name: Deploy Smart Banking to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build -- --configuration production --base-href /smart_banking/

      - name: Find dist folder
        id: find_dist
        run: |
          DIST_PATH=$(find dist -name "index.html" -type f | head -1 | xargs dirname)
          if [ -z "$DIST_PATH" ]; then
            echo "ERROR: No index.html found in dist"
            exit 1
          fi
          echo "dist_path=$DIST_PATH" >> $GITHUB_OUTPUT
          echo "Found dist at: $DIST_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_dist.outputs.dist_path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
